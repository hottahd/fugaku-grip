const KEY = 'fugaku_grip_pw';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open_(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name: 'PBKDF2', hash: 'SHA-256', salt: b64(P.salt), iterations: P.iter},
                                            base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(P.iv)}, key, b64(P.data));
  const html = new TextDecoder().decode(plain);
  // フォーカスのあるパスワード欄を消すと、Chrome が次の操作で Secure Input を入れるらしいので、先に外す（2026-11-06）
  document.activeElement?.blur();
  document.open(); document.write(html); document.close();
}
function stored() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const pw = document.getElementById('pw').value;
  const msg = document.getElementById('msg');
  msg.textContent = '';
  try {
    const keep = document.getElementById('keep').checked;
    await open_(pw);
    try { if (keep) localStorage.setItem(KEY, pw); } catch (e) {}
  } catch (e) {
    msg.textContent = 'パスワードが違います。';
  }
});
const saved = stored();
if (saved) open_(saved).catch(() => { try { localStorage.removeItem(KEY); } catch (e) {} });
